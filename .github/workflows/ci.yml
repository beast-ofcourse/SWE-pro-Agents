name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check bin/swe-pro-agents.js
          node --check scripts/install.js
          node --check scripts/uninstall.js
          node --check scripts/validate.js
          node --check scripts/loop-logic.js
          node --check scripts/ledger.js
          node --check scripts/loop-gate.js
          node --check scripts/run-loop.js
          node --check scripts/validate-plan.js
          node --check scripts/pack-config.js
          node --check scripts/probe-spawn.js
          node --check scripts/cli-shared.js
          node --check scripts/build-plugin.js
          node --check test/installer.test.js
          node --check test/validate.test.js
          node --check test/validate-plan.test.js
          node --check test/loop-logic.test.js
          node --check test/ledger.test.js
          node --check test/loop-gate.test.js
          node --check test/run-loop.test.js
          node --check test/bin.test.js
          node --check test/continuation.test.js
          node --check test/pack-config.test.js
          node --check test/probe-spawn.test.js
          node --check test/background-delegate.test.js
          node --check test/background-plugin.test.js
          node --check test/background-worktree.test.js
          node --check test/background-integration.test.js
          node --check test/build-plugin.test.js
          node --check test/background-journal.test.js
          node --check test/background-spawner.test.js
          node --check test/background-results.test.js
          node --check test/background-scheduler.test.js
          node --check test/background-dashboard.test.js
          node --check test/install-select.test.js
      - name: Plugin freshness (codegen in sync)
        run: node scripts/build-plugin.js --check
      - name: Plugin codegen tests
        run: node test/build-plugin.test.js
      - name: Pack validation (agents + skills, strict)
        run: npm run validate
      - name: Installer lifecycle tests
        run: node test/installer.test.js
      - name: Validator self-tests
        run: node test/validate.test.js
      - name: Plan validator self-tests
        run: node test/validate-plan.test.js
      - name: Loop logic tests
        run: node test/loop-logic.test.js
      - name: Ledger tests
        run: node test/ledger.test.js
      - name: Loop gate tests
        run: node test/loop-gate.test.js
      - name: Loop runner tests
        run: node test/run-loop.test.js
      - name: CLI tests
        run: node test/bin.test.js
      - name: Continuation plugin tests
        run: node test/continuation.test.js
      - name: Config module tests
        run: node test/pack-config.test.js
      - name: Spawn probe tests
        run: node test/probe-spawn.test.js
      - name: Background delegation tests
        run: node test/background-delegate.test.js
      - name: Background plugin tests
        run: node test/background-plugin.test.js
      - name: Background worktree tests
        run: node test/background-worktree.test.js
      - name: Background integration tests
        run: node test/background-integration.test.js
      - name: Background journal tests
        run: node test/background-journal.test.js
      - name: Background spawner tests
        run: node test/background-spawner.test.js
      - name: Background results tests
        run: node test/background-results.test.js
      - name: Background scheduler tests
        run: node test/background-scheduler.test.js
      - name: Background dashboard tests
        run: node test/background-dashboard.test.js
      - name: Install selection tests
        run: node test/install-select.test.js
