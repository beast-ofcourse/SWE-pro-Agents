<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="SWE Pro Agents — a full engineering team in your terminal">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#0F1420"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.18" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.88" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#22d3ee" fill-opacity="0.10"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="blurSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="termClip">
      <rect x="900" y="150" width="610" height="450" rx="16"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.7"/>
  <rect width="1600" height="900" fill="url(#glowCyan)"/>
  <rect width="1600" height="900" fill="url(#glowViolet)"/>
  <circle cx="280" cy="180" r="180" fill="#22d3ee" opacity="0.10" filter="url(#blur)"/>
  <circle cx="1370" cy="760" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#blur)"/>

  <!-- ============ LEFT — wordmark ============ -->

  <!-- badge chip -->
  <g transform="translate(100, 168)">
    <rect width="252" height="40" rx="20" fill="url(#cardGrad)" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="24" cy="20" r="4.5" fill="#34d399"/>
    <circle cx="24" cy="20" r="9" fill="#34d399" opacity="0.25"/>
    <text x="42" y="26" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#e2e8f0" letter-spacing="0.5">49 AGENTS · 8 SKILLS</text>
  </g>

  <!-- corner brackets -->
  <g stroke="url(#wordGrad)" stroke-width="3" fill="none" opacity="0.9">
    <path d="M100 262 L100 238 Q100 230 108 230 L132 230"/>
    <path d="M672 262 L672 238 Q672 230 664 230 L640 230"/>
    <path d="M100 512 L100 536 Q100 544 108 544 L132 544"/>
    <path d="M672 512 L672 536 Q672 544 664 544 L640 544"/>
  </g>

  <!-- SWE PRO -->
  <text x="94" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif" font-size="148" font-weight="800" fill="url(#wordGrad)" letter-spacing="-4">
    SWE<tspan fill="#e2e8f0"> PRO</tspan>
  </text>

  <!-- AGENTS outline -->
  <text x="99" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="none" stroke="#94a3b8" stroke-width="1.4" letter-spacing="26">AGENTS</text>

  <!-- tagline -->
  <text x="100" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="23" fill="#94a3b8">
    A full engineering team in your terminal.
  </text>

  <!-- prompt pill -->
  <g transform="translate(100, 590)">
    <rect width="560" height="54" rx="12" fill="#0B1220" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="24" cy="27" r="3.5" fill="#22d3ee"/>
    <circle cx="36" cy="27" r="3.5" fill="#8b5cf6"/>
    <circle cx="48" cy="27" r="3.5" fill="#f472b6"/>
    <text x="70" y="35" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#7dd3fc">@swe-pro</text>
    <text x="158" y="35" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#94a3b8">plan and ship the rate-limiter</text>
    <rect x="632" y="14" width="2" height="26" fill="#67e8f9" opacity="0.9"/>
  </g>

  <!-- ============ RIGHT — terminal ============ -->

  <g transform="translate(900, 150)">
    <!-- glow behind terminal -->
    <rect x="-14" y="-14" width="638" height="478" rx="24" fill="url(#btnGrad)" opacity="0.10" filter="url(#blurSm)"/>

    <!-- window -->
    <rect width="610" height="450" rx="16" fill="url(#termGrad)" stroke="#1e293b" stroke-width="1.5"/>

    <!-- title bar -->
    <line x1="0" y1="52" x2="610" y2="52" stroke="#1e293b" stroke-width="1"/>
    <circle cx="24" cy="26" r="6" fill="#f87171"/>
    <circle cx="44" cy="26" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="26" r="6" fill="#34d399"/>
    <text x="305" y="31" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#64748b">swe-pro-agents — zsh</text>

    <!-- terminal body -->
    <g clip-path="url(#termClip)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">
      <text x="28" y="96" fill="#64748b"># feature delivery pipeline</text>
      <text x="28" y="130" fill="#67e8f9">$</text>
      <text x="46" y="130" fill="#e2e8f0">@swe-planner</text>
      <text x="170" y="130" fill="#94a3b8">plan the work</text>
      <text x="286" y="130" fill="#34d399">ok · 4 steps</text>

      <text x="28" y="166" fill="#67e8f9">$</text>
      <text x="46" y="166" fill="#e2e8f0">@swe-fullstack</text>
      <text x="180" y="166" fill="#94a3b8">implement end-to-end</text>
      <text x="340" y="166" fill="#34d399">ok</text>

      <text x="28" y="202" fill="#67e8f9">$</text>
      <text x="46" y="202" fill="#e2e8f0">@swe-testing</text>
      <text x="174" y="202" fill="#94a3b8">write + run tests</text>
      <text x="322" y="202" fill="#34d399">12/12 pass</text>

      <text x="28" y="238" fill="#67e8f9">$</text>
      <text x="46" y="238" fill="#e2e8f0">@swe-reviewer</text>
      <text x="176" y="238" fill="#94a3b8">read-only diff review</text>
      <text x="334" y="238" fill="#34d399">0 issues</text>

      <text x="28" y="274" fill="#64748b">──────────────────────────────────</text>

      <text x="28" y="310" fill="#34d399">✔ 3 of 3 checks passed</text>
      <text x="28" y="342" fill="#e2e8f0">✔ shipped to</text>
      <text x="132" y="342" fill="#7dd3fc">main</text>

      <rect x="28" y="356" width="2" height="18" fill="#67e8f9" opacity="0.9"/>
    </g>
  </g>

  <!-- ============ BOTTOM — agent network ============ -->

  <g transform="translate(0, 700)">
    <!-- connectors -->
    <g stroke="#1e293b" stroke-width="1.6">
      <path d="M140 130 L300 130"/>
      <path d="M300 130 L460 130"/>
      <path d="M460 130 L620 130"/>
      <path d="M620 130 L780 130"/>
      <path d="M780 130 L940 130"/>
      <path d="M940 130 L1100 130"/>
      <path d="M1100 130 L1260 130"/>
      <path d="M1260 130 L1420 130"/>
    </g>
    <!-- faint vertical risers -->
    <g stroke="#1e293b" stroke-width="1" opacity="0.7">
      <path d="M300 130 L300 96"/>
      <path d="M620 130 L620 96"/>
      <path d="M940 130 L940 96"/>
      <path d="M1260 130 L1260 96"/>
    </g>

    <!-- nodes -->
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">
      <circle cx="140" cy="130" r="16" fill="#0B1220" stroke="#38bdf8" stroke-width="2"/>
      <text x="140" y="135" text-anchor="middle" fill="#7dd3fc" font-size="14">P</text>
      <text x="140" y="166" text-anchor="middle" fill="#94a3b8">planner</text>

      <circle cx="300" cy="130" r="16" fill="#0B1220" stroke="#38bdf8" stroke-width="2"/>
      <text x="300" y="135" text-anchor="middle" fill="#7dd3fc" font-size="14">F</text>
      <text x="300" y="104" text-anchor="middle" fill="#94a3b8">frontend</text>

      <circle cx="460" cy="130" r="16" fill="#0B1220" stroke="#38bdf8" stroke-width="2"/>
      <text x="460" y="135" text-anchor="middle" fill="#7dd3fc" font-size="14">B</text>
      <text x="460" y="166" text-anchor="middle" fill="#94a3b8">backend</text>

      <circle cx="620" cy="130" r="16" fill="#0B1220" stroke="#a78bfa" stroke-width="2"/>
      <text x="620" y="135" text-anchor="middle" fill="#c4b5fd" font-size="14">DB</text>
      <text x="620" y="104" text-anchor="middle" fill="#94a3b8">database</text>

      <circle cx="780" cy="130" r="16" fill="#0B1220" stroke="#38bdf8" stroke-width="2"/>
      <text x="780" y="135" text-anchor="middle" fill="#7dd3fc" font-size="14">T</text>
      <text x="780" y="166" text-anchor="middle" fill="#94a3b8">testing</text>

      <circle cx="940" cy="130" r="16" fill="#0B1220" stroke="#a78bfa" stroke-width="2"/>
      <text x="940" y="135" text-anchor="middle" fill="#c4b5fd" font-size="13">R</text>
      <text x="940" y="104" text-anchor="middle" fill="#94a3b8">reviewer</text>

      <circle cx="1100" cy="130" r="16" fill="#0B1220" stroke="#38bdf8" stroke-width="2"/>
      <text x="1100" y="135" text-anchor="middle" fill="#7dd3fc" font-size="14">S</text>
      <text x="1100" y="166" text-anchor="middle" fill="#94a3b8">security</text>

      <circle cx="1260" cy="130" r="16" fill="#0B1220" stroke="#a78bfa" stroke-width="2"/>
      <text x="1260" y="135" text-anchor="middle" fill="#c4b5fd" font-size="14">D</text>
      <text x="1260" y="104" text-anchor="middle" fill="#94a3b8">devops</text>

      <circle cx="1420" cy="130" r="16" fill="url(#btnGrad)" stroke="#67e8f9" stroke-width="1.5"/>
      <text x="1420" y="135" text-anchor="middle" fill="#0B1220" font-size="13" font-weight="700">+</text>
      <text x="1420" y="166" text-anchor="middle" fill="#94a3b8">41 more</text>
    </g>
  </g>
</svg>
