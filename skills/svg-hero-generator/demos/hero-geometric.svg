<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace">
  <rect width="1200" height="630" fill="#0a0c10"/>

  <!-- layered panel stack, right field -->
  <g transform="translate(720,90)">
    <g opacity="0.5">
      <rect x="0" y="180" width="360" height="46" rx="4" fill="none" stroke="#1c2433" stroke-width="1.5"/>
      <rect x="0" y="234" width="360" height="46" rx="4" fill="none" stroke="#1c2433" stroke-width="1.5"/>
      <rect x="0" y="288" width="360" height="46" rx="4" fill="none" stroke="#1c2433" stroke-width="1.5"/>
    </g>

    <!-- highlighted rows -->
    <g font-size="14">
      <rect x="0" y="0" width="360" height="46" rx="4" fill="#101623" stroke="#2a3a5c" stroke-width="1.5"/>
      <circle cx="26" cy="23" r="4" fill="#3b82f6"/>
      <text x="44" y="28" fill="#c7d0e0">swe-planner</text>
      <text x="336" y="28" text-anchor="end" fill="#4b5566">plan</text>

      <rect x="0" y="54" width="360" height="46" rx="4" fill="#101623" stroke="#2a3a5c" stroke-width="1.5"/>
      <circle cx="26" cy="77" r="4" fill="#3b82f6"/>
      <text x="44" y="82" fill="#c7d0e0">swe-implementation</text>
      <text x="336" y="82" text-anchor="end" fill="#4b5566">build</text>

      <rect x="0" y="108" width="360" height="46" rx="4" fill="#101623" stroke="#2a3a5c" stroke-width="1.5"/>
      <circle cx="26" cy="131" r="4" fill="#3b82f6"/>
      <text x="44" y="136" fill="#c7d0e0">swe-reviewer</text>
      <text x="336" y="136" text-anchor="end" fill="#4b5566">verify + review</text>
    </g>

    <!-- connecting rail -->
    <line x1="-24" y1="23" x2="-24" y2="131" stroke="#232d42" stroke-width="2"/>
    <circle cx="-24" cy="23" r="3" fill="#3b82f6"/>
    <circle cx="-24" cy="131" r="3" fill="#3b82f6"/>
  </g>

  <!-- left: title block -->
  <g transform="translate(80,0)">
    <text x="0" y="230" fill="#e8ecf4" font-size="56" font-weight="700" letter-spacing="-1">SWE Pro</text>
    <text x="0" y="290" fill="#e8ecf4" font-size="56" font-weight="700" letter-spacing="-1">Agents</text>

    <rect x="2" y="320" width="46" height="3" fill="#3b82f6"/>

    <text x="0" y="366" fill="#8b93a3" font-size="17">25 agents. One Constitution.</text>
    <text x="0" y="392" fill="#8b93a3" font-size="17">Zero rediscovered context.</text>

    <g font-size="13" fill="#5b6472">
      <text x="0" y="460">opencode</text>
      <circle cx="72" cy="456" r="2" fill="#3b4354"/>
      <text x="86" y="460">MIT</text>
      <circle cx="126" cy="456" r="2" fill="#3b4354"/>
      <text x="140" y="460">npm i -g swe-pro-agents</text>
    </g>
  </g>

  <text x="80" y="580" fill="#3b4354" font-size="14">github.com/beast-ofcourse/SWE-pro-Agents</text>
</svg>
