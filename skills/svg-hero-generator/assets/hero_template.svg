<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Consolas, monospace">

  <!--
    HERO TEMPLATE — starting scaffold, not a finished banner.

    This is a repo-agnostic skeleton wired up with correct spacing, grouping,
    and baselines per references/svg_rules.md. Replace every placeholder
    value below with real facts about the specific repo. Delete groups that
    don't fit the chosen concept direction; don't feel obliged to keep all of them.

    Layer map:
      #bg            background + optional subtle pattern
      #title-group   project title (one line)
      #subtitle-group  one optional subtitle line
      #fact-chips    up to ~4 short fact/badge chips in a row
      #accent        one restrained decorative/structural accent shape

    Grid: 8px base unit. Canvas 1280x640 (2:1). Edge padding = 40px minimum.
  -->

  <!-- ============ BACKGROUND ============ -->
  <g id="bg">
    <rect x="0" y="0" width="1280" height="640" fill="#0b0f13"/>
    <!-- Optional subtle deterministic pattern — delete if the chosen concept
         doesn't call for one. Keep opacity low so it never competes with text. -->
    <!--
    <g id="bg-pattern" opacity="0.06" stroke="#7dd3fc" stroke-width="1">
      <line x1="0" y1="160" x2="1280" y2="160"/>
      <line x1="0" y1="320" x2="1280" y2="320"/>
      <line x1="0" y1="480" x2="1280" y2="480"/>
    </g>
    -->
  </g>

  <!-- ============ TITLE ============ -->
  <!-- Baseline at y=280. Font-size 64 fits short-to-medium titles at x=64;
       drop to 48-56 for long project names rather than letting it run wide. -->
  <g id="title-group">
    <text x="64" y="288" font-size="64" font-weight="700" fill="#f5f7fa"
          text-anchor="start" letter-spacing="-0.5">
      project-name
    </text>
  </g>

  <!-- ============ SUBTITLE ============ -->
  <!-- Baseline at y=336, i.e. 48px below the title baseline. One line only. -->
  <g id="subtitle-group">
    <text x="64" y="336" font-size="22" fill="#9aa7b2" text-anchor="start">
      one-line description of what this project actually does
    </text>
  </g>

  <!-- ============ FACT CHIPS ============ -->
  <!-- Row of short fact/badge chips. Each chip: rounded rect + centered label.
       Gap between chips = 16px. y-position leaves >=48px below the subtitle. -->
  <g id="fact-chips" font-size="14" font-weight="600">
    <!-- Chip 1 -->
    <g transform="translate(64, 400)">
      <rect width="96" height="32" rx="6" fill="none" stroke="#3a4753" stroke-width="1"/>
      <text x="48" y="21" fill="#c7d0d8" text-anchor="middle">v1.0.0</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(176, 400)">
      <rect width="88" height="32" rx="6" fill="none" stroke="#3a4753" stroke-width="1"/>
      <text x="44" y="21" fill="#c7d0d8" text-anchor="middle">MIT</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(280, 400)">
      <rect width="120" height="32" rx="6" fill="none" stroke="#3a4753" stroke-width="1"/>
      <text x="60" y="21" fill="#c7d0d8" text-anchor="middle">TypeScript</text>
    </g>
    <!-- Add or remove chips as the real repo warrants. Keep total chip count <= 4. -->
  </g>

  <!-- ============ ACCENT ============ -->
  <!-- One restrained structural/decorative accent. Replace with whatever the
       chosen concept direction actually calls for (a node graph, a terminal
       frame, a single geometric mark) — this placeholder is intentionally inert. -->
  <g id="accent" opacity="0.9">
    <circle cx="1140" cy="140" r="3" fill="#7dd3fc"/>
    <circle cx="1140" cy="140" r="24" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.4"/>
  </g>

</svg>
